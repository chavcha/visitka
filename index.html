<!doctype html>
<html lang="en">
  <head>
    <script>
      ;(function () {
        try {
          var m = localStorage.getItem('visitka-theme')
          var a = localStorage.getItem('visitka-accent')
          var light =
            m === 'light' ||
            (m !== 'dark' &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
          document.documentElement.dataset.accent =
            a === 'violet' || a === 'emerald' ? a : 'blue'
        } catch (e) {}
      })()
    </script>
